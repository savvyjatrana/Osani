<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSANI.COM - Global Online Mega Store</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body { background-color: #fcf8f7; color: #3d282b; }
    .top-header { background-color: #3d282b; display: flex; align-items: center; padding: 10px 18px; gap: 16px; color: white; }
    .logo-container { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; cursor: pointer; }
    .logo-slot { width: 42px; height: 42px; border: 1px solid #b76e79; border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #4e3538; flex-shrink: 0; }
    .logo-slot img { width: 100%; height: 100%; object-fit: cover; }
    .brand-title { font-size: 24px; font-weight: 800; color: #b76e79; letter-spacing: -0.5px; }
    .brand-title span { color: #f3e6e8; font-size: 15px; }
    .deliver-box { display: flex; flex-direction: column; font-size: 12px; cursor: pointer; padding: 4px 6px; border-radius: 3px; }
    .deliver-box:hover, .nav-action:hover { outline: 1px solid #b76e79; }
    .deliver-box .sub { color: #d1b8bc; font-size: 11px; }
    .deliver-box .main { color: #b76e79; font-weight: bold; }
    .currency-dropdown-container { position: relative; display: inline-block; }
    .currency-btn { background: #4e3538; color: #f3e6e8; border: 1px solid #b76e79; border-radius: 4px; padding: 7px 12px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .currency-dropdown-menu { display: none; position: absolute; top: 100%; left: 0; background: #ffffff; min-width: 130px; box-shadow: 0 6px 16px rgba(61,40,43,0.25); border-radius: 4px; padding: 6px 0; z-index: 2000; border: 1px solid #e6d3d6; }
    .currency-dropdown-container:hover .currency-dropdown-menu { display: block; }
    .currency-option { padding: 8px 14px; font-size: 12px; color: #3d282b; cursor: pointer; font-weight: 600; }
    .currency-option:hover { background-color: #f9f1f2; color: #b76e79; }
    .search-box { flex: 1; display: flex; height: 40px; border-radius: 4px; overflow: hidden; border: 1px solid #b76e79; }
    .search-box input { flex: 1; border: none; padding: 0 14px; font-size: 15px; outline: none; background: #fff; }
    .search-box button { background-color: #b76e79; border: none; width: 48px; cursor: pointer; font-size: 18px; color: white; }
    .header-actions { display: flex; align-items: center; gap: 12px; margin-left: auto; }
    .nav-action { display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: 600; color: #f3e6e8; cursor: pointer; padding: 4px 8px; border-radius: 4px; position: relative; transition: background 0.2s; }
    .nav-action:hover { background-color: #4e3538; color: #b76e79; }
    .nav-action span.icon { font-size: 16px; margin-bottom: 2px; }
    .badge-counter { background-color: #b76e79; color: white; font-size: 10px; padding: 1px 5px; border-radius: 10px; font-weight: bold; position: absolute; top: 1px; right: 2px; }
    .sub-navbar { background-color: #4e3538; display: flex; align-items: center; padding: 0 16px; position: relative; z-index: 1000; }
    .sub-navbar ul { display: flex; list-style: none; align-items: center; width: 100%; }
    .nav-item { position: relative; }
    .nav-link { display: flex; align-items: center; gap: 6px; color: #f3e6e8; text-decoration: none; font-size: 13px; font-weight: 600; padding: 12px 14px; cursor: pointer; }
    .nav-link:hover { background-color: #5e4246; color: #b76e79; }
    .dropdown-menu { display: none; position: absolute; top: 100%; left: 0; background: #ffffff; min-width: 240px; box-shadow: 0 6px 16px rgba(61,40,43,0.2); border-radius: 0 0 4px 4px; padding: 8px 0; border: 1px solid #e6d3d6; }
    .dropdown-menu a { display: block; padding: 9px 18px; font-size: 13px; color: #3d282b; text-decoration: none; cursor: pointer; }
    .dropdown-menu a:hover { background-color: #f9f1f2; color: #b76e79; padding-left: 22px; }
    .nav-item:hover .dropdown-menu { display: block; }
    .right-promo { margin-left: auto; color: #e8d0d3; font-size: 12px; font-weight: 500; }
    .priority-strip { background-color: #5e4246; color: #f3e6e8; font-size: 13px; font-weight: bold; padding: 9px 18px; display: flex; justify-content: space-between; align-items: center; }
    .priority-strip .show-all-btn { color: #b76e79; font-size: 12px; text-decoration: underline; cursor: pointer; }
    .container { max-width: 1400px; margin: 18px auto; padding: 0 16px; }
    .results-heading { font-size: 20px; font-weight: bold; margin-bottom: 18px; color: #3d282b; border-bottom: 2px solid #e6d3d6; padding-bottom: 8px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .product-card { background: #ffffff; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; box-shadow: 0 2px 8px rgba(183,110,121,0.12); border: 1px solid #ebd9dc; transition: transform 0.2s; position: relative; }
    .product-card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(183,110,121,0.25); }
    .image-box { width: 100%; height: 230px; background: #fdfdfd; display: flex; align-items: center; justify-content: center; border-radius: 4px; overflow: hidden; margin-bottom: 10px; cursor: pointer; }
    .image-box img { max-width: 100%; max-height: 100%; object-fit: cover; width: 100%; height: 100%; }
    .wishlist-btn { width: 100%; padding: 7px 0; border: 1px solid #d5d5d5; background: #ffffff; color: #282c3f; font-size: 12px; font-weight: 700; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 10px; }
    .wishlist-btn.active { background-color: #b76e79; color: #ffffff; border-color: #a35a64; }
    .product-category { font-size: 11px; font-weight: bold; color: #8c6a6f; text-transform: uppercase; margin-bottom: 4px; }
    .product-title { font-size: 14px; font-weight: 600; color: #3d282b; line-height: 1.35; cursor: pointer; text-decoration: none; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 38px; }
    .ratings { color: #b76e79; font-size: 13px; margin-bottom: 8px; }
    .price-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 14px; }
    .price-value { font-size: 20px; font-weight: bold; color: #3d282b; }
    .original-price { font-size: 13px; color: #8c8c8c; text-decoration: line-through; }
    .badge-discount { color: #b76e79; font-size: 12px; font-weight: bold; }
    .button-group { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
    .btn { width: 100%; padding: 10px 12px; font-size: 13px; font-weight: bold; border-radius: 20px; cursor: pointer; text-align: center; border: none; }
    .btn-add-cart { background-color: #f5e4e7; color: #3d282b; border: 1px solid #e6cbd0; }
    .btn-buy-osani { background-color: #b76e79; color: white; }
    .notification-toast { position: fixed; top: 25px; right: -380px; width: 350px; background: #ffffff; border-left: 5px solid #b76e79; box-shadow: 0 8px 24px rgba(61, 40, 43, 0.25); border-radius: 6px; padding: 16px; z-index: 100000; transition: right 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55); display: flex; align-items: flex-start; gap: 12px; }
    .notification-toast.show { right: 25px; }
    .checkout-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(61, 40, 43, 0.7); z-index: 99999; align-items: center; justify-content: center; padding: 15px; }
    .checkout-modal { background: #ffffff; width: 100%; max-width: 650px; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    .modal-header { background-color: #3d282b; color: white; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 17px; color: #b76e79; }
    .close-modal-btn { color: #ccc; font-size: 24px; font-weight: bold; cursor: pointer; background: none; border: none; }
    .modal-body { padding: 20px; max-height: 80vh; overflow-y: auto; background-color: #f5f5f6; }
    .place-order-btn { width: 100%; background: #ff3f6c; color: white; border: none; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 14px; text-transform: uppercase; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 3px; color: #3d282b; }
    .form-group input, .form-group select { width: 100%; padding: 8px 10px; border: 1px solid #b76e79; border-radius: 4px; font-size: 13px; background: #fff; }
    .site-footer { background-color: #3d282b; color: #e8d0d3; margin-top: 40px; padding: 40px 16px; text-align: center; font-size: 13px; }
  </style>
</head>
<body>

  <div class="notification-toast" id="notificationToast">
    <div class="toast-icon">🛍️</div>
    <div class="toast-content">
      <h4 id="toastTitle">Notification</h4>
      <p id="toastMessage">Item successfully added to cart.</p>
    </div>
  </div>

  <header class="top-header">
    <a href="javascript:void(0)" onclick="loadCollection('all', 'All Departments & Collections')" class="logo-container">
      <div class="logo-slot"><img src="logo.png" alt="Logo" onerror="this.onerror=null; this.parentNode.innerHTML='<span>LOGO</span>';"></div>
      <div class="brand-title">OSANI<span>.COM</span></div>
    </a>
    <div class="currency-dropdown-container">
      <div class="currency-btn" id="currentCurrencyLabel">INR (₹) ▼</div>
      <div class="currency-dropdown-menu">
        <div class="currency-option" onclick="changeCurrency('INR', 'INR (₹)')">INR (₹)</div>
        <div class="currency-option" onclick="changeCurrency('USD', 'USD ($)')">USD ($)</div>
      </div>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search departments..." onkeyup="if(event.key==='Enter') doSearch()">
      <button type="button" onclick="doSearch()">🔍</button>
    </div>
    <div class="header-actions">
      <div class="nav-action" onclick="openCartCheckout()">
        <span class="icon">🛒</span>
        <span>Bag</span>
        <span class="badge-counter" id="cartCounter">0</span>
      </div>
    </div>
  </header>

  <main class="container" id="catalogContainer">
    <h2 class="results-heading" id="collectionHeading">Catalog</h2>
    <div class="product-grid" id="productContainer"></div>
  </main>

  <!-- Checkout Modal -->
  <div class="checkout-modal-overlay" id="checkoutModal">
    <div class="checkout-modal">
      <div class="modal-header">
        <h3>🛍️ Shopping Bag & Checkout</h3>
        <button class="close-modal-btn" onclick="closeCheckout()">×</button>
      </div>
      <div class="modal-body" id="modalBodyContainer">
        <div id="bagItemsView">
          <div id="bagItemsListContainer"></div>
          <button class="place-order-btn" onclick="proceedToAddressStep()">Proceed to Shipping</button>
        </div>
        <div id="shippingFormView" style="display: none;">
          <div class="form-group"><label>Full Name *</label><input type="text" id="custName"></div>
          <div class="form-group"><label>Email (for email confirmation) *</label><input type="email" id="custEmail" placeholder="user@example.com"></div>
          <div class="form-group"><label>Address Line 1 *</label><input type="text" id="custAddr1"></div>
          <div class="form-group"><label>Address Line 2 *</label><input type="text" id="custAddr2"></div>
          <div class="form-group"><label>Pincode *</label><input type="text" id="custPincode"></div>
          <div class="form-group"><label>Phone *</label><input type="text" id="custPhone"></div>
          <div id="checkoutFormError" style="display:none; color:#c0392b; font-size:12px; margin-bottom:10px;"></div>
          <button class="place-order-btn" onclick="processPayment()">Place Order</button>
        </div>
        <div id="checkoutSuccessView" style="display: none;"></div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>© 2026 Osani.com — All Rights Reserved.</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const productsDB = [
      { id: "JW01", category: "jewelry", sub: "choker", title: "Royal Kundan Choker Necklace", img: "https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=600", price: "2,499", orig: "4,999", disc: "50% off", rating: "⭐⭐⭐⭐⭐" }
    ];

    const firebaseConfig = {
      apiKey: "AIzaSyARcy6Pr85p8-4UVbNBh1LILR4nfVS3JIU",
      authDomain: "osani-84e2e.firebaseapp.com",
      projectId: "osani-84e2e"
    };
    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch (e) { console.warn("Firebase init warning:", e); }

    // FIXED: cartItems starts completely empty (0 counter on load)
    let cartItems = [];
    let currentCurrency = "INR";
    let currencyRates = { INR: 1, USD: 0.012 };
    let currencySymbols = { INR: "₹", USD: "$" };

    function formatPrice(p) {
      let val = parseFloat(p.replace(/,/g, '')) || 0;
      return `${currencySymbols[currentCurrency]}${(val * currencyRates[currentCurrency]).toFixed(2)}`;
    }

    function updateCartUI() {
      document.getElementById('cartCounter').innerText = cartItems.reduce((s, i) => s + (i.qty || 1), 0);
    }

    function renderProducts(items) {
      const container = document.getElementById('productContainer');
      container.innerHTML = items.map(item => `
        <div class="product-card">
          <div class="image-box"><img src="${item.img}" alt="${item.title}"></div>
          <span class="product-category">${item.category}</span>
          <a class="product-title">${item.title}</a>
          <div class="ratings">${item.rating}</div>
          <div class="price-row">
            <span class="price-value">${formatPrice(item.price)}</span>
            <span class="original-price">${formatPrice(item.orig)}</span>
            <span class="badge-discount">${item.disc}</span>
          </div>
          <div class="button-group">
            <button class="btn btn-add-cart" onclick="addToCart('${item.id}')">Add to Bag</button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      let prod = productsDB.find(p => p.id === id);
      if (!prod) return;
      let existing = cartItems.find(i => i.id === id);
      if (existing) existing.qty = (existing.qty || 1) + 1;
      else cartItems.push({ ...prod, qty: 1 });
      updateCartUI();
      alert(`"${prod.title}" added to bag!`);
    }

    function openCartCheckout() {
      if (cartItems.length === 0) { alert("Your bag is empty."); return; }
      document.getElementById('bagItemsListContainer').innerHTML = cartItems.map(i => `<p>${i.title} (x${i.qty}) - ${formatPrice(i.price)}</p>`).join('');
      document.getElementById('bagItemsView').style.display = 'block';
      document.getElementById('shippingFormView').style.display = 'none';
      document.getElementById('checkoutModal').style.display = 'flex';
    }

    function proceedToAddressStep() {
      document.getElementById('bagItemsView').style.display = 'none';
      document.getElementById('shippingFormView').style.display = 'block';
    }

    function closeCheckout() { document.getElementById('checkoutModal').style.display = 'none'; }

    async function processPayment() {
      let name = document.getElementById('custName').value.trim();
      let email = document.getElementById('custEmail').value.trim();
      let addr1 = document.getElementById('custAddr1').value.trim();
      let addr2 = document.getElementById('custAddr2').value.trim();
      let pincode = document.getElementById('custPincode').value.trim();
      let phone = document.getElementById('custPhone').value.trim();

      if (!name || !email || !addr1 || !pincode || !phone) {
        alert("Please fill in all required fields including your email.");
        return;
      }

      let orderDoc = {
        status: "pending",
        retailPrice: cartItems.reduce((s, i) => s + (parseFloat(i.price.replace(/,/g,'')) * (i.qty||1)), 0),
        customer: { name, email, phone, address1: addr1, address2: addr2, pincode },
        items: cartItems.map(i => ({ productId: i.id, title: i.title, quantity: i.qty || 1, unitPrice: parseFloat(i.price.replace(/,/g,'')) })),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        let ref = await db.collection("orders").add(orderDoc);
        alert(`Order placed successfully! ID: ${ref.id}`);
        cartItems = [];
        updateCartUI();
        closeCheckout();
      } catch (e) {
        alert("Checkout error: " + e.message);
      }
    }

    window.onload = function() { renderProducts(productsDB); };
  </script>
</body>
</html>
