<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSANI.COM - Admin Control Panel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #fcf8f7; color: #3d282b; padding: 20px; }
    h1 { color: #b76e79; margin-bottom: 20px; }
    .section { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #e6d3d6; padding: 10px; text-align: left; font-size: 13px; }
    th { background: #f5e4e7; }
  </style>
</head>
<body>
  <h1>OSANI.COM - Admin Dashboard</h1>
  <div class="section">
    <h3>Live Orders</h3>
    <table>
      <thead>
        <tr><th>Order ID</th><th>Customer</th><th>Total</th><th>Status</th></tr>
      </thead>
      <tbody id="ordersTableBody"><tr><td colspan="4">Loading...</td></tr></tbody>
    </table>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyARcy6Pr85p8-4UVbNBh1LILR4nfVS3JIU",
      authDomain: "osani-84e2e.firebaseapp.com",
      projectId: "osani-84e2e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    db.collection("orders").orderBy("createdAt", "desc").onSnapshot(snapshot => {
      let rows = "";
      snapshot.forEach(doc => {
        let o = doc.data();
        rows += `<tr><td><b>${doc.id}</b></td><td>${o.customer?.name || ''}</td><td>₹${o.retailPrice}</td><td>${o.status}</td></tr>`;
      });
      document.getElementById('ordersTableBody').innerHTML = rows || '<tr><td colspan="4">No orders found.</td></tr>';
    });
  </script>
</body>
</html>
